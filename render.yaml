services:
  - type: web
    name: data-privacy-risk-checker-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: data_privacy_checker

